## Bygger APK som appen hämtar för automatisk uppdatering.
## Release (tagg + uppladdning) bara vid push till main: alla enheter installerar den.
## En pull request bygger bara, så att den kan granskas utan att något rullas ut.
name: Build and Release APK

on:
  push:
    branches:
      - main  # Runs when code is pushed to the main branch (adjust if you use another branch)
    # Bara dokumentation: inget nytt bygge
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v2
        with:
          java-version: '17'  # Use Java 17 for Android Gradle plugin 8.7.0
          distribution: 'temurin'

      - name: Decode keystore from secret
        if: github.event_name == 'push'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build the APK
        #run: ./gradlew assembleRelease  # Build APK with Gradle
        run: ./gradlew assembleDebug

      - name: Build release APK
        if: github.event_name == 'push'
        run: ./gradlew assembleRelease
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Show APK path
        if: github.event_name == 'push'
        run: ls -l app/build/outputs/apk/release/

      - name: Debug APK File
        run: ls -lR app/build/outputs/apk/

      - name: Extract version from build.gradle
        if: github.event_name == 'push'
        id: get_version
        run: |
          # Extract versionCode and versionName from build.gradle
          VERSION_NAME=$(grep versionName app/build.gradle | head -n 1 | sed 's/.*"\(.*\)".*/\1/')
          VERSION_CODE=$(grep versionCode app/build.gradle | head -n 1 | sed 's/.*\([0-9]*\).*/\1/')
          echo "VERSION_NAME=$VERSION_NAME" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Tagging release as $VERSION_NAME"

      # Finns releasen för versionen redan (versionName inte höjd): ingen ny tagg eller uppladdning
      - name: Check if release exists
        if: github.event_name == 'push'
        run: |
          if gh release view "v${{ env.VERSION_NAME }}" > /dev/null 2>&1; then
            echo "Release v${{ env.VERSION_NAME }} finns redan, hoppar över"
            echo "RELEASE_EXISTS=true" >> $GITHUB_ENV
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Git tag
        if: github.event_name == 'push' && env.RELEASE_EXISTS != 'true'
        run: |
          # Create a tag using versionName (e.g., v1.0.0)
          git tag v${{ env.VERSION_NAME }}
          git push origin v${{ env.VERSION_NAME }}  # Push the tag to GitHub

      # Bara release-APK:n publiceras. Debug-bygget har WebView-felsökning och http mot
      # emulatorn påslaget och ska aldrig finnas i en publik release.
      - name: Upload APK to GitHub releases
        if: github.event_name == 'push' && env.RELEASE_EXISTS != 'true'
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/app-release.apk
          tag_name: v${{ env.VERSION_NAME }}  # Use the versionName from the gradle file as the tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Use GitHub token for creating the release
